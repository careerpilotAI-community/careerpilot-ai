name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify and test backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Temporary formatter extraction for Branch 28
        run: |
          npx prettier --write src/Tracker.tsx src/styles.css
          echo "===TRACKER_BEGIN==="
          cat src/Tracker.tsx
          echo "===TRACKER_END==="
          echo "===CSS_BEGIN==="
          cat src/styles.css
          echo "===CSS_END==="
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run frontend tests
        run: npm run test:run
      - name: Build frontend
        run: npm run build
