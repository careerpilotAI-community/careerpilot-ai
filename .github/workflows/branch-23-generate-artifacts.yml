name: Branch 23 Artifact Generation and Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-23-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Generate lockfile and validate frontend
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'branch-23-build-quality-baseline-improvements'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm for lockfile generation
        run: npm install --global npm@10.9.2
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run frontend tests
        run: npm run test:run
      - name: Build frontend
        run: npm run build
      - name: Show npm diagnostics on failure
        if: failure()
        run: cat "$(ls -t ~/.npm/_logs/* | head -n 1)"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: branch-23-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Generate Maven Wrapper and validate backend
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'branch-23-build-quality-baseline-improvements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned Maven distribution
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip \
            --output /tmp/apache-maven.zip
          unzip -q /tmp/apache-maven.zip -d /tmp
      - name: Generate Maven Wrapper
        working-directory: backend
        run: |
          /tmp/apache-maven-3.9.11/bin/mvn \
            --batch-mode --no-transfer-progress -N \
            org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper \
            -Dmaven=3.9.11 -Dtype=bin
      - name: Verify backend with generated wrapper
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload Maven Wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: branch-23-maven-wrapper
          path: |
            backend/mvnw
            backend/mvnw.cmd
            backend/.mvn/wrapper/maven-wrapper.jar
            backend/.mvn/wrapper/maven-wrapper.properties
          if-no-files-found: error
          retention-days: 7

  commit-generated-files:
    name: Commit generated build artifacts to Branch 23
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-23-build-quality-baseline-improvements
      - name: Download frontend lockfile
        uses: actions/download-artifact@v4
        with:
          name: branch-23-frontend-lockfile
          path: frontend
      - name: Download Maven Wrapper
        uses: actions/download-artifact@v4
        with:
          name: branch-23-maven-wrapper
          path: backend
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x backend/mvnw
          git add frontend/package-lock.json backend/mvnw backend/mvnw.cmd backend/.mvn/wrapper/maven-wrapper.properties
          if git diff --cached --quiet; then
            echo "No generated build artifacts changed."
            exit 0
          fi
          git commit -m "build: add deterministic lockfile and Maven Wrapper"
          git push origin HEAD:refs/heads/branch-23-build-quality-baseline-improvements
