spring.application.name=careerpilot-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=CareerPilot AI API
info.app.description=Career development platform API
info.app.version=0.1.0-SNAPSHOT

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot}
spring.datasource.username=${DATABASE_USERNAME:careerpilot}
spring.datasource.password=${DATABASE_PASSWORD:careerpilot_local_dev_only}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_USERNAME:${DATABASE_USERNAME:careerpilot}}
spring.flyway.password=${FLYWAY_PASSWORD:${DATABASE_PASSWORD:careerpilot_local_dev_only}}
