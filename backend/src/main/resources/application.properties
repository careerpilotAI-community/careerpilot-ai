spring.application.name=careerpilot-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=CareerPilot AI API
info.app.description=Career development platform API
info.app.version=0.1.0-SNAPSHOT

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot}
spring.datasource.username=${DATABASE_USERNAME:careerpilot}
spring.datasource.password=${DATABASE_PASSWORD:careerpilot_local_dev_only}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_USERNAME:${DATABASE_USERNAME:careerpilot}}
spring.flyway.password=${FLYWAY_PASSWORD:${DATABASE_PASSWORD:careerpilot_local_dev_only}}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
app.registration.enabled=${REGISTRATION_ENABLED:false}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.session.absolute-timeout-ms=${SESSION_ABSOLUTE_TIMEOUT_MS:43200000}

# Private resume storage: keep outside the repository and all web-served directories.
app.documents.storage-root=${DOCUMENT_STORAGE_ROOT:${user.home}/.careerpilot/private-documents}
app.documents.user-quota-bytes=${DOCUMENT_USER_QUOTA_BYTES:104857600}
app.documents.deployment-quota-bytes=${DOCUMENT_DEPLOYMENT_QUOTA_BYTES:2147483648}
app.documents.clamav.host=${CLAMAV_HOST:127.0.0.1}
app.documents.clamav.port=${CLAMAV_PORT:3310}
app.documents.clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:15000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
